# Base PostgreSQL locale pour le backend (en cluster : database: true dans helm.yaml).
# Démarrage : docker compose up -d   |   arrêt : docker compose down (ajouter -v pour effacer les données)
services:
  postgres:
    image: postgres:18-alpine
    container_name: quali-formation-postgres
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 : le volume se monte sur /var/lib/postgresql (et non plus .../data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
