# Analyse SonarQube du composant (projet <dépôt>-<composant>), lancée par la CI
# après make test-unit (formation-ba-gitops/ci-template/sonarqube).
sonar.sources=src
sonar.tests=src
# Fichiers de test (*.test.js, *.test.jsx) et faux backend des tests Sessions
sonar.exclusions=**/*.test.jsx,**/*.test.js,src/sessions/fauxBackend.js
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,src/sessions/fauxBackend.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Démarrage / câblage, sans logique à tester : hors calcul de couverture
sonar.coverage.exclusions=src/main.jsx
