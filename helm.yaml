# Applications de ce dépôt, déployées par formation-ba-gitops (chart charts-ba-formations).
# Ce fichier : ce qui est identique dans tous les environnements.
# values-<env>.yaml : ce qui change par environnement (tag écrit par Kargo,
# replicas, variables). Helm fusionne les deux, clé par clé (le second l'emporte).
# URL : frontend https://<application>.formation-ba-quali-formation.<env>.check-consulting.net
#       backends https://gateway.formation-ba-quali-formation.<env>.check-consulting.net/<route>/...  (préfixe retiré)
applications:
  backend:
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-quali-formation/backend
    containerPort: 8000
    service:
      port: 80
    # Pas d'Ingress : Service ClusterIP seulement, exposé par le gateway (plus bas).
    # Base PostgreSQL quali_formation : créée et sauvegardée automatiquement.
    # Consigne : dans backend/config/settings.py, construire DATABASES à partir de la
    # variable injectée DATABASE_URL :
    #   DATABASES = {"default": dj_database_url.config(default=...)}
    # DATABASE_URL (postgresql://<user>:<password>@<hôte>:<port>/<base>) contient déjà
    # l'utilisateur et le mot de passe. Valeurs séparées, injectées aussi :
    #   PGUSER, PGPASSWORD, PGHOST, PGPORT, PGDATABASE
    database: quali_formation
    env:
      LOG_LEVEL: info
  frontend:
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-quali-formation/frontend
    containerPort: 8080
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false

# Gateway : https://gateway.formation-ba-quali-formation.<env>.check-consulting.net<path>/...
# Un Ingress par route sur le Traefik de la plateforme (pas de pod).
gateway:
  enabled: true
  # Applications autorisées à appeler le gateway depuis le navigateur (CORS) :
  # converties en https://<application>.<projet>.<env>.check-consulting.net
  cors:
    origins: [frontend]
  routes:
    backend:
      path: /backend           # préfixe d'URL sur le gateway
      service: backend         # Service (application) appelé
      stripPrefix: true        # /backend/items -> /items
      cors: true               # applique cors.origins
      middlewares: []          # noms de gateway.middlewares
  # Middlewares du projet, spec Traefik native (Middleware gateway-<nom>), ex. :
  #   limite: {rateLimit: {average: 50, burst: 100}}
  middlewares: {}

# Base PostgreSQL du projet : Cluster app-db, un par environnement, avec ses
# sauvegardes S3 (bucket de l'environnement). Une valeur qui change selon
# l'environnement se met dans values-<env>.yaml.
database:
  instances: 1                 # 1 : pas de réplique
  enablePDB: false             # sans réplique, un PDB bloquerait le drain du nœud
  storage: 2Gi                 # ne peut qu'augmenter
  superuser: false             # true : Secret app-db-superuser (postgres)
  # Bases du cluster (une par application avec database) et réglages par base
  databases:
    quali_formation: {}
  backup:
    # Base complète planifiée + WAL archivés en continu : restauration à
    # n'importe quel instant de la fenêtre de rétention (PITR)
    physical:
      enabled: true
      schedule: "0 0 2 * * *"  # 6 champs (secondes en tête) : 02:00 UTC
      retention: 7d
    # pg_dump quotidien de chaque base (pour une seule base : databases.<base>.logical,
    # bloc complet {enabled, schedule, retentionDays})
    logical:
      enabled: false
      schedule: "30 2 * * *"   # 5 champs : 02:30 UTC
      retentionDays: 14
  # Archive S3 où le cluster écrit. Restauration (gitops/README.md, « Restaurer
  # une base »), dans values-<env>.yaml : archive neuve (app-db-g1, -g2...),
  # restore.from = ancienne archive, restore.enabled: true, puis false.
  archive: app-db
  restore:
    enabled: false
    from: ""                   # archive lue pendant la restauration
    targetTime: ""             # ex. "2026-10-20T10:30:00Z" ; vide = dernier état archivé
